<div class="relative min-h-screen w-full flex items-center justify-start overflow-hidden">
<!-- Imagem de fundo em tela cheia -->
<img alt="Costa paradisíaca com montanhas e mar turquesa" class="absolute inset-0 w-full h-full object-cover object-center" src="https://lh3.googleusercontent.com/aida/AEtjO1VzlzEfd38tRCPP9lJoQO7sSkdDVFhRwswjypE0K_RzMkbe3H2mmWi-Oo9bPkIHm22MxapgBXTzwAfKJ7CEcFcicxJIG9Zy0AYgC6HEZlnz0M4it1ohxm80ts72BwiwVNiK-pxQSXzwaRc7VD_CCCxuZTawLpgZzHf8XqI280dAuGxdQaVuAGdZ4TbV35fKrWjmO6R3uUo_G6dX4qKwn6TVkq4zVwr3W0fmwDoDyi1i"/>
<!-- Overlay suave para ambientação e contraste -->
<div class="absolute inset-0 bg-slate-950/25 backdrop-brightness-95"></div>
<!-- Conteúdo em primeiro plano: Cartão flutuante alinhado à esquerda -->
<div class="relative z-10 w-full max-w-xl px-6 py-12 md:px-16 lg:px-20 flex flex-col justify-center min-h-screen">
<div class="w-full max-w-md bg-surface-container-lowest/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 md:p-10 border border-white/40">
<!-- Cabeçalho / Logo VOYA Travel -->
<div class="flex items-center gap-3 mb-8">
<div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center text-on-primary font-bold text-headline-sm shadow-sm">
          V
        </div>
<span class="font-headline-sm text-headline-sm text-on-surface font-bold tracking-tight">VOYA Travel</span>
</div>
<!-- Título & Subtítulo -->
<div class="mb-6">
<h1 class="text-headline-lg font-headline-lg text-on-surface font-bold mb-1">Entrar</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Acesse sua conta com suas credenciais.</p>
</div>
<!-- Formulário de Login -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Campo E-mail -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2 font-semibold" for="username">
            E-mail ou Usuário
          </label>
<input class="w-full h-11 px-4 bg-surface-container-low text-on-surface rounded-lg outline-none font-body-md text-body-md placeholder:text-outline-variant focus:bg-surface-container transition-colors" id="username" name="username" placeholder="seu.email@exemplo.com" required="" type="text"/>
</div>
<!-- Campo Senha -->
<div>
<div class="flex items-center justify-between mb-2">
<label class="block font-label-md text-label-md text-on-surface font-semibold" for="password">
              Senha
            </label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">
              Esqueci minha senha
            </a>
</div>
<input class="w-full h-11 px-4 bg-surface-container-low text-on-surface rounded-lg outline-none font-body-md text-body-md placeholder:text-outline-variant focus:bg-surface-container transition-colors" id="password" name="password" placeholder="Sua senha secreta" required="" type="password"/>
</div>
<!-- Botão Entrar -->
<button class="w-full h-11 rounded-lg bg-primary text-on-primary font-label-lg text-label-lg font-semibold hover:brightness-105 transition-all mt-2 cursor-pointer shadow-sm" type="submit">
          Entrar
        </button>
</form>
<!-- Separador -->
<div class="relative my-6">
<div class="absolute inset-0 flex items-center">
<div class="w-full bg-surface-container-high h-[1px]"></div>
</div>
<div class="relative flex justify-center">
<span class="px-3 bg-surface-container-lowest text-outline font-label-sm text-label-sm uppercase">
            Ou continue com
          </span>
</div>
</div>
<!-- Redes Sociais -->
<div class="grid grid-cols-2 gap-3">
<button class="h-11 rounded-lg bg-surface-container-low hover:bg-surface-container text-on-surface font-label-md text-label-md font-semibold flex items-center justify-center gap-2 cursor-pointer transition-colors" type="button">
<svg aria-hidden="true" class="w-4 h-4" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.25 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27a7.22 7.22 0 0 1 0-4.54V6.58H1.25a11.98 11.98 0 0 0 0 10.84l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.25 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span>Google</span>
</button>
<button class="h-11 rounded-lg bg-surface-container-low hover:bg-surface-container text-on-surface font-label-md text-label-md font-semibold flex items-center justify-center gap-2 cursor-pointer transition-colors" type="button">
<svg aria-hidden="true" class="w-4 h-4 fill-[#1877F2]" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
<span>Facebook</span>
</button>
</div>
<!-- Link Criar Conta -->
<div class="mt-6 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
          Não tem conta? 
          <a class="font-label-md text-label-md text-primary font-semibold hover:underline" href="#">
            Criar uma conta
          </a>
</p>
</div>
<!-- Rodapé Interno do Cartão -->
<div class="text-center text-outline font-body-sm text-body-sm pt-4 mt-2 border-t border-surface-container">
        © 2025 Voya Travel. Todos os direitos reservados.
      </div>
</div>
</div>
</div>
<script>
    (function() {
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');

      if (toggleBtn && passwordInput && eyeIcon) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });
      }
    })();
  </script>
</div></main></body></html>
